[project]
name = "ecs-flask-app"
version = "1.0.0"
description = "Containerized Flask app deployed to AWS ECS Fargate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.3",
    "gunicorn>=22.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
